<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nawy.ai</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
height:100vh;
display:flex;
overflow:hidden;
}

.sidebar{
width:250px;
background:#090909;
border-right:1px solid #151515;
padding:20px;
position:relative;
}

.logo{
font-size:24px;
font-weight:bold;
margin-bottom:40px;
}

.menu a{
display:block;
padding:14px;
margin-bottom:10px;
border-radius:12px;
color:white;
text-decoration:none;
cursor:pointer;
transition:.3s;
}

.menu a:hover{
background:#7c3aed;
}

.main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

.page{
display:none;
flex-direction:column;
align-items:center;
animation:fade .35s ease;
}

.page.active{
display:flex;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.title{
font-size:42px;
margin-bottom:20px;
text-shadow:
0 0 2px #fff,
0 0 4px #fff;
}

.input-box{
width:650px;
max-width:90vw;
padding:18px;
border-radius:14px;
border:1px solid #7c3aed;
background:#000;
color:white;
outline:none;
font-size:16px;
}

.btn{
margin-top:15px;
padding:14px 30px;
border:none;
border-radius:12px;
background:#7c3aed;
color:white;
cursor:pointer;
font-size:16px;
transition:.25s;
}

.btn:hover{
background:#9333ea;
}

.top-buttons{
position:absolute;
top:20px;
right:25px;
display:flex;
gap:15px;
}

.neon-btn{
position:relative;
padding:12px 24px;
color:white;
text-decoration:none;
border-radius:12px;
}

.neon-btn::before{
content:"";
position:absolute;
inset:0;
padding:2px;
border-radius:12px;

background:linear-gradient(
90deg,
#7c3aed,
#a855f7,
#7c3aed
);

background-size:300% 300%;
animation:borderMove 3s linear infinite;

-webkit-mask:
linear-gradient(#fff 0 0) content-box,
linear-gradient(#fff 0 0);

-webkit-mask-composite:xor;
mask-composite:exclude;
}

.socials{
position:absolute;
bottom:20px;
left:20px;
display:flex;
gap:12px;
}

.social{
width:55px;
height:55px;
display:flex;
align-items:center;
justify-content:center;
text-decoration:none;
color:white;
font-size:24px;
position:relative;
}

.social::before{
content:"";
position:absolute;
inset:0;
padding:2px;
border-radius:10px;

background:linear-gradient(
90deg,
#7c3aed,
#a855f7,
#7c3aed
);

background-size:300% 300%;
animation:borderMove 3s linear infinite;

-webkit-mask:
linear-gradient(#fff 0 0) content-box,
linear-gradient(#fff 0 0);

-webkit-mask-composite:xor;
mask-composite:exclude;

filter:drop-shadow(0 0 8px #a855f7);
}

@keyframes borderMove{
0%{
background-position:0% 50%;
}
100%{
background-position:300% 50%;
}
}

</style>
</head>

<body>

<div class="top-buttons">
<a href="#" class="neon-btn">Oturum Aç</a>
<a href="#" class="neon-btn">Kayıt Ol</a>
</div>

<div class="sidebar">

<div class="logo">NAWY.AI</div>

<div class="menu">
<a onclick="showPage('home')">🏠 Ana Sayfa</a>
<a onclick="showPage('youtube')">🎥 YouTube</a>
<a onclick="showPage('podcast')">🎙️ PodCast</a>
<a onclick="showPage('settings')">⚙️ Ayarlar</a>
</div>

<div class="socials">
<a href="#" class="social">🎮</a>
<a href="#" class="social">📸</a>
<a href="#" class="social">🎵</a>
</div>

</div>

<div class="main">

<div id="home" class="page active">
<h1 class="title">Welcome to Nawy.ai</h1>
</div>

<div id="youtube" class="page">
<h1 class="title">YouTube URL</h1>

<input
class="input-box"
type="text"
placeholder="YouTube linkini yapıştır...">

<button class="btn">Özet Çıkar</button>
</div>

<div id="podcast" class="page">
<h1 class="title">Upload Podcast</h1>

<input
class="input-box"
type="file">

<button class="btn">Dosya Yükle</button>
</div>

<div id="settings" class="page">
<h1 class="title">Ayarlar</h1>
</div>

</div>

<script>

function showPage(pageId){

document.querySelectorAll('.page').forEach(page=>{
page.classList.remove('active');
});

document.getElementById(pageId).classList.add('active');

}

</script>

</body>
</html>
