<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nawy.ai</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
display:flex;
height:100vh;
overflow:hidden;
}

.sidebar{
width:240px;
background:#0d0d0d;
border-right:1px solid #222;
padding:20px;
}

.logo{
font-size:24px;
font-weight:bold;
margin-bottom:40px;
}

.menu a{
display:block;
padding:14px;
margin-bottom:10px;
border-radius:12px;
text-decoration:none;
color:white;
cursor:pointer;
transition:.3s;
}

.menu a:hover{
background:#7c3aed;
}

.main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
}

.page{
display:none;
flex-direction:column;
align-items:center;
animation:show .4s ease;
}

.page.active{
display:flex;
}

@keyframes show{
from{
opacity:0;
transform:translateY(25px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.title{
font-size:42px;
margin-bottom:20px;
color:white;
text-shadow:
0 0 5px #a855f7,
0 0 15px #a855f7;
}

.input-box{
width:650px;
max-width:90vw;
padding:18px;
border:none;
outline:none;
border-radius:14px;
background:#111;
color:white;
font-size:16px;
}

.btn{
margin-top:15px;
padding:14px 30px;
border:none;
border-radius:12px;
background:#7c3aed;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<div class="sidebar">

<div class="logo">NAWY.AI</div>

<div class="menu">
<a onclick="showPage('home')">🏠 Ana Sayfa</a>
<a onclick="showPage('youtube')">🎥 YouTube</a>
<a onclick="showPage('podcast')">🎙️ PodCast</a>
<a onclick="showPage('settings')">⚙️ Ayarlar</a>
</div>

</div>

<div class="main">

<div id="home" class="page active">
<h1>Nawy.ai</h1>
</div>

<div id="youtube" class="page">
<h1 class="title">YouTube URL</h1>

<input class="input-box"
placeholder="YouTube linkini yapıştır...">

<button class="btn">Özet Çıkar</button>
</div>

<div id="podcast" class="page">
<h1 class="title">PodCast URL</h1>

<input class="input-box"
placeholder="Podcast linkini yapıştır...">

<button class="btn">Özet Çıkar</button>
</div>

<div id="settings" class="page">
<h1 class="title">Ayarlar</h1>
</div>

</div>

<script>
function showPage(pageId){

document.querySelectorAll('.page').forEach(page=>{
page.classList.remove('active');
});

document.getElementById(pageId).classList.add('active');

}
</script>

</body>
</html>
