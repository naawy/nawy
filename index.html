<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nawy.ai</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
height:100vh;
display:flex;
overflow:hidden;
}

/* SIDEBAR (BOYUT SABİT) */
.sidebar{
width:260px;
background:#090909;
border-right:1px solid #151515;
padding:20px;
position:relative;
overflow:hidden;
}

/* TOGGLE BUTTON */
.toggle-btn{
position:absolute;
top:18px;
left:18px;
cursor:pointer;
font-size:18px;
padding:8px 10px;
border-radius:8px;
border:1px solid #2a2a2a;
background:#0f0f0f;
transition:0.3s;
z-index:10;
}

.toggle-btn:hover{
background:#111;
}

/* LOGO */
.logo{
margin-left:45px;
margin-bottom:40px;
font-size:20px;
font-weight:bold;
color:#e5e5e5;
}

/* MENU */
.menu a{
display:flex;
align-items:center;
gap:12px;
padding:14px;
margin-bottom:10px;
border-radius:14px;
color:white;
text-decoration:none;
cursor:pointer;
transition:.25s;
}

.menu a i{
width:38px;
height:38px;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
background:linear-gradient(135deg,#1a1a1a,#0f0f0f);
border:1px solid #2a2a2a;
color:#f5f5f5;
transition:.25s;
}

.menu a:hover{
background:#111;
box-shadow:0 0 10px rgba(124,58,237,0.5);
}

.menu a:hover i{
border-color:#7c3aed;
box-shadow:0 0 10px rgba(124,58,237,0.7);
color:#a855f7;
}

/* SOCIALS */
.socials{
position:absolute;
bottom:20px;
left:20px;
display:flex;
gap:10px;
}

.social{
width:40px;
height:40px;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
border:1px solid #222;
color:#f5f5f5;
transition:.3s;
}

.social:hover{
transform:translateY(-3px) scale(1.05);
}

/* MAIN */
.main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

/* PAGE ANIMATION */
.page{
position:absolute;
opacity:0;
transform:scale(1.08) translateY(20px);
filter:blur(8px);
pointer-events:none;
transition:0.4s ease;
display:flex;
flex-direction:column;
align-items:center;
}

.page.active{
opacity:1;
transform:scale(1) translateY(0);
filter:blur(0);
pointer-events:auto;
}

/* TOP BUTTONS */
.top-buttons{
position:absolute;
top:20px;
right:25px;
display:flex;
gap:15px;
}

.neon-btn{
padding:12px 24px;
border-radius:12px;
color:white;
text-decoration:none;
border:1px solid #5b21b6;
opacity:0.8;
}

.title{
font-size:40px;
margin-bottom:20px;
}

/* TOGGLE MOVE ANIMATION */
.sidebar.move-toggle .toggle-btn{
left:18px;
top:18px;
}

</style>
</head>

<body>

<div class="top-buttons">
<a href="#" class="neon-btn">Oturum Aç</a>
<a href="#" class="neon-btn">Kayıt Ol</a>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

<div class="toggle-btn" onclick="toggleUI()">
<i class="fa-solid fa-bars"></i>
</div>

<div class="logo">nawy ai</div>

<div class="menu">

<a onclick="showPage('home')">
<i class="fa-solid fa-house"></i><span>Ana Sayfa</span>
</a>

<a onclick="showPage('youtube')">
<i class="fa-brands fa-youtube"></i><span>YouTube</span>
</a>

<a onclick="showPage('podcast')">
<i class="fa-solid fa-microphone"></i><span>Podcast</span>
</a>

<a onclick="showPage('settings')">
<i class="fa-solid fa-gear"></i><span>Ayarlar</span>
</a>

</div>

<div class="socials">
<a class="social"><i class="fa-brands fa-discord"></i></a>
<a class="social"><i class="fa-brands fa-instagram"></i></a>
<a class="social"><i class="fa-brands fa-tiktok"></i></a>
</div>

</div>

<!-- MAIN -->
<div class="main">

<div id="home" class="page active">
<h1 class="title">Welcome to Nawy.ai</h1>
</div>

<div id="youtube" class="page">
<h1 class="title">YouTube</h1>
</div>

<div id="podcast" class="page">
<h1 class="title">Podcast</h1>
</div>

<div id="settings" class="page">
<h1 class="title">Ayarlar</h1>
</div>

</div>

<script>

let moved = false;

function toggleUI(){

const sidebar = document.getElementById("sidebar");
const btn = document.querySelector(".toggle-btn");

moved = !moved;

/* sadece ikonun “ışınlanma hissi” */
if(moved){
btn.style.transform = "translateX(0px)";
}else{
btn.style.transform = "translateX(0px)";
}

/* ileride kullanmak için toggle state */
sidebar.classList.toggle("active");

}

function showPage(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

</script>

</body>
</html>
