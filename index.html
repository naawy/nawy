<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nawy.ai</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
height:100vh;
display:flex;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
width:260px;
background:#090909;
border-right:1px solid #151515;
padding:20px;
position:relative;
transition:0.35s ease;
overflow:hidden;
}

/* COLLAPSED */
.sidebar.collapsed{
width:85px;
}

/* LOGO AREA */

.logo{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:40px;
font-size:20px;
font-weight:bold;
color:#e5e5e5;
}

/* TOGGLE BTN */

.toggle-btn{
cursor:pointer;
font-size:16px;
padding:6px 10px;
border-radius:8px;
border:1px solid #2a2a2a;
transition:.3s;
}

.toggle-btn:hover{
background:#111;
}

/* MENU */

.menu a{
display:flex;
align-items:center;
gap:12px;
padding:14px;
margin-bottom:10px;
border-radius:14px;
color:white;
text-decoration:none;
cursor:pointer;
transition:.3s;
}

/* ICONS */
.menu a i{
width:38px;
height:38px;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
background:linear-gradient(135deg,#1a1a1a,#0f0f0f);
border:1px solid #2a2a2a;
color:#f5f5f5;
transition:.3s;
}

/* TEXT */
.menu a span{
transition:0.2s;
white-space:nowrap;
}

/* COLLAPSE TEXT HIDE */
.sidebar.collapsed .menu a span{
opacity:0;
width:0;
display:none;
}

/* CENTER ICONS WHEN COLLAPSED */
.sidebar.collapsed .menu a{
justify-content:center;
}

/* SOCIALS */

.socials{
position:absolute;
bottom:20px;
left:20px;
display:flex;
gap:12px;
transition:.3s;
}

/* HIDE SOCIALS ON COLLAPSE */
.sidebar.collapsed .socials{
display:none;
}

/* SOCIAL BASE */
.social{
width:42px;
height:42px;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
text-decoration:none;
transition:.3s;
}

.social:hover{
transform:translateY(-5px) scale(1.1);
}

/* MAIN */

.main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

/* PAGE ANIMATION */

.page{
position:absolute;
opacity:0;
transform:scale(1.08) translateY(20px);
filter:blur(8px);
pointer-events:none;
transition:0.45s cubic-bezier(0.2, 0.9, 0.2, 1);
display:flex;
flex-direction:column;
align-items:center;
}

.page.active{
opacity:1;
transform:scale(1) translateY(0);
filter:blur(0);
pointer-events:auto;
}

/* TOP */

.top-buttons{
position:absolute;
top:20px;
right:25px;
display:flex;
gap:15px;
z-index:999;
}

.neon-btn{
padding:12px 24px;
border-radius:12px;
color:white;
text-decoration:none;
border:1px solid #5b21b6;
opacity:0.8;
}

/* TITLE */

.title{
font-size:40px;
margin-bottom:20px;
color:#f5f5f5;
}

</style>
</head>

<body>

<div class="top-buttons">
<a href="#" class="neon-btn">Oturum Aç</a>
<a href="#" class="neon-btn">Kayıt Ol</a>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

<div class="logo">
<span>nawy ai</span>

<div class="toggle-btn" onclick="toggleSidebar()">
<i class="fa-solid fa-chevron-left" id="toggleIcon"></i>
</div>

</div>

<div class="menu">

<a onclick="showPage('home')">
<i class="fa-solid fa-house"></i><span>Ana Sayfa</span>
</a>

<a onclick="showPage('youtube')">
<i class="fa-brands fa-youtube"></i><span>YouTube</span>
</a>

<a onclick="showPage('podcast')">
<i class="fa-solid fa-microphone"></i><span>Podcast</span>
</a>

<a onclick="showPage('settings')">
<i class="fa-solid fa-gear"></i><span>Ayarlar</span>
</a>

</div>

<div class="socials">
<a href="#" class="social"><i class="fa-brands fa-discord"></i></a>
<a href="#" class="social"><i class="fa-brands fa-instagram"></i></a>
<a href="#" class="social"><i class="fa-brands fa-tiktok"></i></a>
</div>

</div>

<!-- MAIN -->
<div class="main">

<div id="home" class="page active">
<h1 class="title">Welcome to Nawy.ai</h1>
</div>

<div id="youtube" class="page">
<h1 class="title">YouTube URL</h1>
</div>

<div id="podcast" class="page">
<h1 class="title">Podcast</h1>
</div>

<div id="settings" class="page">
<h1 class="title">Ayarlar</h1>
</div>

</div>

<script>

/* PAGE SWITCH */
function showPage(pageId){
document.querySelectorAll('.page').forEach(p=>{
p.classList.remove('active');
});
document.getElementById(pageId).classList.add('active');
}

/* SIDEBAR TOGGLE */
function toggleSidebar(){
const sidebar = document.getElementById("sidebar");
const icon = document.getElementById("toggleIcon");

sidebar.classList.toggle("collapsed");

if(sidebar.classList.contains("collapsed")){
icon.classList.remove("fa-chevron-left");
icon.classList.add("fa-chevron-right");
}else{
icon.classList.remove("fa-chevron-right");
icon.classList.add("fa-chevron-left");
}
}

</script>

</body>
</html>
