<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nawy.ai</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
height:100vh;
display:flex;
overflow:hidden;
}

/* TOP BUTTONS */
.top-buttons{
position:absolute;
top:20px;
right:25px;
display:flex;
gap:15px;
z-index:10;
}

.top-buttons a{
padding:12px 24px;
border-radius:12px;
color:white;
text-decoration:none;
border:1px solid #5b21b6;
opacity:0.8;
transition:0.3s;
}

.top-buttons a:hover{
opacity:1;
background:#111;
}

/* SIDEBAR */
.sidebar{
width:260px;
background:#090909;
border-right:1px solid #151515;
padding:20px;
position:relative;
transition:0.35s ease;
overflow:hidden;
}

.sidebar.collapsed{
width:110px;
}

/* HEADER */
.header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:40px;
position:relative;
}

/* LOGO */
.logo{
font-size:20px;
font-weight:bold;
color:#e5e5e5;
transition:0.3s ease;
}

.sidebar.collapsed .logo{
opacity:0;
transform:translateX(-20px);
width:0;
}

/* TOGGLE */
.toggle-btn{
cursor:pointer;
font-size:18px;
padding:8px 10px;
border-radius:8px;
border:1px solid #2a2a2a;
background:#0f0f0f;
transition:0.35s ease;
}

.sidebar.collapsed .toggle-btn{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
border:none;
background:transparent;
}

/* MENU */
.menu a{
display:flex;
align-items:center;
gap:12px;
padding:14px;
margin-bottom:10px;
border-radius:14px;
color:white;
text-decoration:none;
cursor:pointer;
transition:0.25s;
position:relative;
overflow:hidden;
}

/* ICON */
.menu a i{
width:38px;
height:38px;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
background:#111;
border:1px solid #2a2a2a;
color:#f5f5f5;
transition:0.3s;
}

/* TEXT */
.menu a span{
white-space:nowrap;
transition:0.2s;
}

.sidebar.collapsed .menu a span{
display:none;
}

.sidebar.collapsed .menu a{
justify-content:center;
}

.sidebar.collapsed .menu a i{
background:transparent;
border:none;
font-size:20px;
}

/* MOR NEON HOVER */
.menu a::before{
content:"";
position:absolute;
inset:0;
background:radial-gradient(circle at center, rgba(168,85,247,0.25), transparent 70%);
opacity:0;
transition:0.3s;
}

.menu a:hover::before{
opacity:1;
}

.menu a:hover i{
color:#a855f7;
transform:scale(1.08);
box-shadow:0 0 12px rgba(168,85,247,0.8);
border-color:#7c3aed;
}

.menu a:hover span{
color:#d8b4fe;
}

/* SOCIALS */
.socials{
position:absolute;
bottom:20px;
left:20px;
display:flex;
gap:10px;
}

.sidebar.collapsed .socials{
display:none;
}

.social{
width:40px;
height:40px;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
border:1px solid #222;
transition:0.3s;
text-decoration:none;
}

/* SOCIAL COLORS */
.social.discord i{ color:#5865F2; }

.social.instagram i{
background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.social.tiktok i{ color:white; }

.social:hover{
transform:translateY(-3px) scale(1.08);
border-color:#444;
}

/* MAIN */
.main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

/* PAGES */
.page{
position:absolute;
opacity:0;
transform:scale(1.08) translateY(20px);
filter:blur(8px);
pointer-events:none;
transition:0.4s ease;
display:flex;
flex-direction:column;
align-items:center;
}

.page.active{
opacity:1;
transform:scale(1) translateY(0);
filter:blur(0);
pointer-events:auto;
}

/* INPUT */
.input-box{
width:500px;
padding:15px;
border-radius:12px;
border:1px solid #7c3aed;
background:#000;
color:white;
margin-top:10px;
outline:none;
}

.btn{
margin-top:15px;
padding:12px 25px;
background:#7c3aed;
border:none;
border-radius:12px;
color:white;
cursor:pointer;
}

.file-label{
display:inline-block;
margin-top:10px;
padding:12px 20px;
border:1px solid #7c3aed;
border-radius:12px;
cursor:pointer;
}

.file-name{
margin-top:10px;
color:#aaa;
}

/* TITLE */
.title{
font-size:40px;
margin-bottom:20px;
}

</style>
</head>

<body>

<!-- TOP -->
<div class="top-buttons">
<a href="#">Oturum Aç</a>
<a href="#">Kayıt Ol</a>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

<div class="header">
<div class="logo">nawy ai</div>
<div class="toggle-btn" onclick="toggleSidebar()">
<i class="fa-solid fa-bars"></i>
</div>
</div>

<div class="menu">

<a onclick="showPage('home')">
<i class="fa-solid fa-house"></i><span>Ana Sayfa</span>
</a>

<a onclick="showPage('youtube')">
<i class="fa-brands fa-youtube"></i><span>YouTube</span>
</a>

<a onclick="showPage('podcast')">
<i class="fa-solid fa-microphone"></i><span>Podcast</span>
</a>

<a onclick="showPage('settings')">
<i class="fa-solid fa-gear"></i><span>Ayarlar</span>
</a>

</div>

<div class="socials">
<a class="social discord" href="https://discord.com" target="_blank">
<i class="fa-brands fa-discord"></i>
</a>

<a class="social instagram" href="https://instagram.com" target="_blank">
<i class="fa-brands fa-instagram"></i>
</a>

<a class="social tiktok" href="https://tiktok.com" target="_blank">
<i class="fa-brands fa-tiktok"></i>
</a>
</div>

</div>

<!-- MAIN -->
<div class="main">

<div id="home" class="page active">
<h1 class="title">Welcome to Nawy.ai</h1>
</div>

<div id="youtube" class="page">
<h1 class="title">YouTube URL</h1>
<input class="input-box" type="text" placeholder="YouTube linkini yapıştır...">
<button class="btn">Özet Çıkar</button>
</div>

<div id="podcast" class="page">
<h1 class="title">Podcast Upload</h1>

<label class="file-label">
Dosya Seç
<input type="file" hidden onchange="showFile(this)">
</label>

<div class="file-name" id="fileName">Dosya seçilmedi</div>
</div>

<div id="settings" class="page">
<h1 class="title">Ayarlar</h1>
</div>

</div>

<script>

function toggleSidebar(){
document.getElementById("sidebar").classList.toggle("collapsed");
}

function showPage(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

function showFile(input){
document.getElementById("fileName").innerText =
input.files[0]?.name || "Dosya seçilmedi";
}

</script>

</body>
</html>
