<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nawy.ai</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
height:100vh;
display:flex;
overflow:hidden;
}

/* SIDEBAR */
.sidebar{
width:320px;
background:#090909;
border-right:1px solid #151515;
padding:20px;
padding-top:85px;
position:relative;
transition:.35s ease;
overflow:hidden;
}

.sidebar.collapsed{
width:110px;
}

/* TOGGLE BUTTON */
.toggle-btn{
position:absolute;
top:12px;
left:12px;
width:52px;
height:52px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-size:20px;
border-radius:12px;
border:1px solid #2a2a2a;
background:#0f0f0f;
z-index:999;
transition:.3s;
}

.toggle-btn:hover{
background:#141414;
border-color:#7c3aed;
box-shadow:0 0 15px rgba(124,58,237,.5);
}

/* LOGO */
.logo{
display:flex;
justify-content:center;
align-items:center;
height:80px;
margin-bottom:20px;
}

.logo span{
font-size:26px;
font-weight:700;
color:#fff;
transition:.3s;
}

.sidebar.collapsed .logo span{
opacity:0;
transform:translateX(-20px);
}

/* MENU */
.menu{
margin-top:15px;
display:flex;
flex-direction:column;
gap:12px;
}

.menu a{
display:flex;
align-items:center;
gap:16px;
height:72px;
padding:0 18px;
border-radius:18px;
cursor:pointer;
text-decoration:none;
color:white;
transition:.25s;
}

.menu a:hover{
background:#111;
box-shadow:0 0 15px rgba(124,58,237,.35);
}

/* ICON BOX */
.menu a i{
width:52px;
height:52px;
display:flex;
align-items:center;
justify-content:center;
border-radius:14px;
font-size:20px;
background:linear-gradient(135deg,#1a1a1a,#0f0f0f);
border:1px solid #2a2a2a;
transition:.25s;
}

.menu a:hover i{
border-color:#7c3aed;
box-shadow:0 0 15px rgba(124,58,237,.7);
color:#a855f7;
}

/* TEXT */
.menu a span{
font-size:17px;
font-weight:500;
transition:.3s;
white-space:nowrap;
}

.sidebar.collapsed .menu a{
justify-content:center;
padding:0;
}

.sidebar.collapsed .menu a span{
display:none;
}

/* SOCIALS */
.socials{
position:absolute;
bottom:25px;
left:20px;
display:flex;
gap:12px;
}

.sidebar.collapsed .socials{
display:none;
}

.social{
width:45px;
height:45px;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
border:1px solid #222;
color:white;
text-decoration:none;
transition:.3s;
}

.social:hover{
transform:translateY(-3px);
border-color:#7c3aed;
box-shadow:0 0 12px rgba(124,58,237,.5);
}

/* MAIN */
.main{
flex:1;
position:relative;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* PAGES */
.page{
position:absolute;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

opacity:0;
transform:translateY(25px) scale(1.05);
filter:blur(8px);

pointer-events:none;
transition:.4s ease;
}

.page.active{
opacity:1;
transform:translateY(0) scale(1);
filter:blur(0);
pointer-events:auto;
}

.title{
font-size:52px;
font-weight:700;
}

.subtitle{
margin-top:10px;
opacity:.7;
font-size:18px;
}

</style>
</head>

<body>

<div class="sidebar" id="sidebar">

<div class="toggle-btn" onclick="toggleSidebar()">
<i class="fa-solid fa-bars"></i>
</div>

<div class="logo">
<span>NAWY AI</span>
</div>

<div class="menu">

<a onclick="showPage('home')">
<i class="fa-solid fa-house"></i>
<span>Ana Sayfa</span>
</a>

<a onclick="showPage('youtube')">
<i class="fa-brands fa-youtube"></i>
<span>YouTube</span>
</a>

<a onclick="showPage('podcast')">
<i class="fa-solid fa-microphone"></i>
<span>Podcast</span>
</a>

<a onclick="showPage('settings')">
<i class="fa-solid fa-gear"></i>
<span>Ayarlar</span>
</a>

</div>

<div class="socials">
<a href="#" class="social"><i class="fa-brands fa-discord"></i></a>
<a href="#" class="social"><i class="fa-brands fa-instagram"></i></a>
<a href="#" class="social"><i class="fa-brands fa-tiktok"></i></a>
</div>

</div>

<div class="main">

<div id="home" class="page active">
<h1 class="title">Welcome to Nawy.ai</h1>
<p class="subtitle">AI destekli içerik merkezi</p>
</div>

<div id="youtube" class="page">
<h1 class="title">YouTube</h1>
<p class="subtitle">Video içerikleri burada</p>
</div>

<div id="podcast" class="page">
<h1 class="title">Podcast</h1>
<p class="subtitle">Podcast içerikleri burada</p>
</div>

<div id="settings" class="page">
<h1 class="title">Ayarlar</h1>
<p class="subtitle">Sistem ayarları</p>
</div>

</div>

<script>

function toggleSidebar(){
document.getElementById("sidebar")
.classList.toggle("collapsed");
}

function showPage(id){

document.querySelectorAll(".page")
.forEach(page=>{
page.classList.remove("active");
});

document.getElementById(id)
.classList.add("active");

}

</script>

</body>
</html>
