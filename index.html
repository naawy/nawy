<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nawy.ai</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
height:100vh;
display:flex;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
width:250px;
background:#090909;
border-right:1px solid #151515;
padding:20px;
position:relative;
}

.logo{
font-size:24px;
font-weight:bold;
margin-bottom:40px;
color:#e5e5e5;
}

.menu a{
display:block;
padding:14px;
margin-bottom:10px;
border-radius:12px;
color:white;
text-decoration:none;
cursor:pointer;
transition:.3s;
}

.menu a:hover{
background:#6d28d9;
}

/* SOCIAL */

.socials{
position:absolute;
bottom:20px;
left:20px;
display:flex;
gap:10px;
}

.social{
width:42px;
height:42px;
display:flex;
align-items:center;
justify-content:center;
text-decoration:none;
color:white;
font-size:18px;
position:relative;
opacity:0.8;
}

/* TOP */

.top-buttons{
position:absolute;
top:20px;
right:25px;
display:flex;
gap:15px;
z-index:999;
}

.neon-btn{
padding:12px 24px;
border-radius:12px;
color:white;
text-decoration:none;
border:1px solid #5b21b6;
opacity:0.8;
}

/* MAIN */

.main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

.page{
display:none;
flex-direction:column;
align-items:center;
animation:fade .3s ease;
}

.page.active{
display:flex;
}

@keyframes fade{
from{opacity:0;transform:translateY(15px);}
to{opacity:1;transform:translateY(0);}
}

.title{
font-size:40px;
margin-bottom:20px;
color:#f5f5f5;
}

/* INPUT */

.input-box{
width:650px;
max-width:90vw;
padding:18px;
border-radius:14px;
border:1px solid #5b21b6;
background:#000;
color:white;
font-size:16px;
}

/* BUTTON */

.btn{
margin-top:15px;
padding:14px 30px;
border:none;
border-radius:12px;
background:#6d28d9;
color:white;
cursor:pointer;
}

/* PODCAST UPLOAD BOX */

.upload-box{
width:500px;
max-width:90vw;
height:220px;
border:2px dashed #5b21b6;
border-radius:16px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:15px;
background:#050505;
text-align:center;
padding:20px;
}

.upload-box span{
font-size:14px;
opacity:0.8;
}

.file-name{
font-size:14px;
color:#a855f7;
margin-top:10px;
word-break:break-all;
}

input[type="file"]{
display:none;
}

.file-label{
padding:12px 20px;
border:1px solid #5b21b6;
border-radius:10px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="top-buttons">
<a href="#" class="neon-btn">Oturum Aç</a>
<a href="#" class="neon-btn">Kayıt Ol</a>
</div>

<div class="sidebar">

<div class="logo">NAWY.AI</div>

<div class="menu">
<a onclick="showPage('home')">🏠 Ana Sayfa</a>
<a onclick="showPage('youtube')">🎥 YouTube</a>
<a onclick="showPage('podcast')">🎙️ Podcast</a>
<a onclick="showPage('settings')">⚙️ Ayarlar</a>
</div>

<div class="socials">
<a href="#"><i class="fa-brands fa-discord"></i></a>
<a href="#"><i class="fa-brands fa-instagram"></i></a>
<a href="#"><i class="fa-brands fa-tiktok"></i></a>
</div>

</div>

<div class="main">

<div id="home" class="page active">
<h1 class="title">Welcome to Nawy.ai</h1>
</div>

<div id="youtube" class="page">
<h1 class="title">YouTube URL</h1>
<input class="input-box" type="text" placeholder="YouTube linkini yapıştır...">
<button class="btn">Özet Çıkar</button>
</div>

<!-- PODCAST -->
<div id="podcast" class="page">

<h1 class="title">Podcast</h1>

<div class="upload-box">
<span>Dosyanı yükle</span>

<label class="file-label" for="fileUpload">
Dosya Seç
</label>

<input id="fileUpload" type="file">

<div id="fileName" class="file-name">Henüz dosya seçilmedi</div>
</div>

<button class="btn">Yükle</button>

</div>

<div id="settings" class="page">
<h1 class="title">Ayarlar</h1>
</div>

</div>

<script>

function showPage(pageId){
document.querySelectorAll('.page').forEach(p=>{
p.classList.remove('active');
});
document.getElementById(pageId).classList.add('active');
}

/* DOSYA ADI GOSTER */

document.getElementById("fileUpload").addEventListener("change", function(){
const fileName = this.files[0]?.name;
document.getElementById("fileName").textContent =
fileName ? fileName : "Henüz dosya seçilmedi";
});

</script>

</body>
</html>
