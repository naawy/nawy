<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nawy.ai</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* (SENİN CSS AYNI KALIYOR, KISALTTIM) */

body{
background:#000;
color:white;
height:100vh;
display:flex;
overflow:hidden;
}

.top-buttons{
position:absolute;
top:20px;
right:25px;
display:flex;
gap:15px;
}

.top-buttons a{
padding:12px 24px;
border-radius:12px;
border:1px solid #5b21b6;
color:white;
text-decoration:none;
cursor:pointer;
}

/* MODAL */
.modal{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
background:rgba(0,0,0,0.7);
z-index:999;
}

.modal.active{ display:flex; }

.modal-box{
width:360px;
padding:25px;
border-radius:16px;
background:#0b0b0b;
border:1px solid #7c3aed;
display:flex;
flex-direction:column;
gap:10px;
}

.modal-box input{
padding:12px;
border-radius:10px;
border:1px solid #333;
background:#000;
color:white;
}

.modal-box button{
padding:12px;
border:none;
border-radius:10px;
background:#7c3aed;
color:white;
cursor:pointer;
}

.small-link{
font-size:12px;
color:#aaa;
cursor:pointer;
text-align:center;
}

.small-link:hover{ color:#fff; }

</style>
</head>

<body>

<div class="top-buttons">
<a onclick="openLogin()">Oturum Aç</a>
<a onclick="openRegister()">Kayıt Ol</a>
</div>

<!-- LOGIN MODAL -->
<div class="modal" id="loginModal" onclick="closeModal(event,'loginModal')">
<div class="modal-box">

<h2>Oturum Aç</h2>

<input id="loginName" placeholder="Kullanıcı adı">
<input id="loginPass" type="password" placeholder="Şifre">

<button onclick="login()">Giriş Yap</button>

<div class="small-link" onclick="openRegister()">Hesabın yok mu? Kayıt ol</div>
<div class="small-link" onclick="forgotPassword()">Şifremi unuttum</div>

</div>
</div>

<!-- REGISTER MODAL -->
<div class="modal" id="registerModal" onclick="closeModal(event,'registerModal')">
<div class="modal-box">

<h2>Kayıt Ol</h2>

<input id="regName" placeholder="Kullanıcı adı">
<input id="regEmail" placeholder="E-posta">
<input id="regPass" type="password" placeholder="Şifre">

<button onclick="register()">Kayıt Ol</button>

<div class="small-link" onclick="openLogin()">Zaten hesabın var mı? Giriş yap</div>

</div>
</div>

<script>

/* OPEN MODALS */
function openLogin(){
document.getElementById("loginModal").classList.add("active");
document.getElementById("registerModal").classList.remove("active");
}

function openRegister(){
document.getElementById("registerModal").classList.add("active");
document.getElementById("loginModal").classList.remove("active");
}

/* CLOSE */
function closeModal(e,id){
if(e.target.id === id){
document.getElementById(id).classList.remove("active");
}
}

/* REGISTER */
function register(){
let name = document.getElementById("regName").value;
let email = document.getElementById("regEmail").value;
let pass = document.getElementById("regPass").value;

if(!name || !pass) return alert("Eksik bilgi");

let users = JSON.parse(localStorage.getItem("users") || "[]");

users.push({name,email,pass});

localStorage.setItem("users", JSON.stringify(users));

alert("Kayıt başarılı!");
openLogin();
}

/* LOGIN */
function login(){
let name = document.getElementById("loginName").value;
let pass = document.getElementById("loginPass").value;

let users = JSON.parse(localStorage.getItem("users") || "[]");

let user = users.find(u => u.name === name && u.pass === pass);

if(!user){
alert("Hatalı giriş!");
return;
}

alert("Giriş başarılı!");
document.getElementById("loginModal").classList.remove("active");
}

/* FORGOT PASSWORD */
function forgotPassword(){
alert("Şifre sıfırlama linki e-postana gönderildi (demo sistem)");
}

</script>

</body>
</html>
