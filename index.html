<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nawy.ai</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
height:100vh;
display:flex;
overflow:hidden;
}

/* SIDEBAR */
.sidebar{
width:260px;
background:#090909;
border-right:1px solid #151515;
padding:20px;
position:relative;
transition:0.35s ease;
overflow:hidden;
}

.sidebar.collapsed{
width:110px;
}

/* HEADER */
.header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:40px;
}

.logo{
font-size:20px;
font-weight:bold;
}

/* TOGGLE */
.toggle-btn{
cursor:pointer;
font-size:18px;
padding:8px 10px;
border-radius:8px;
border:1px solid #2a2a2a;
background:#0f0f0f;
}

/* MENU */
.menu a{
display:flex;
align-items:center;
gap:12px;
padding:14px;
margin-bottom:10px;
border-radius:14px;
color:white;
text-decoration:none;
cursor:pointer;
transition:0.25s;
}

.menu a i{
width:38px;
height:38px;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
background:#111;
border:1px solid #2a2a2a;
transition:0.3s;
}

/* TEXT */
.menu a span{
white-space:nowrap;
}

.sidebar.collapsed .menu a span{
display:none;
}

.sidebar.collapsed .menu a{
justify-content:center;
}

.sidebar.collapsed .menu a i{
background:transparent;
border:none;
font-size:20px;
}

/* NEON HOVER */
.menu a:hover i{
color:#a855f7;
}

/* ================= SOCIAL COLORS ================= */

.socials{
position:absolute;
bottom:20px;
left:20px;
display:flex;
gap:10px;
}

.sidebar.collapsed .socials{
display:none;
}

/* DISCORD */
.social.discord i{ color:#5865F2; }

/* INSTAGRAM */
.social.instagram i{
background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* TIKTOK */
.social.tiktok i{ color:#fff; }

/* SOCIAL BASE */
.social{
width:40px;
height:40px;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
border:1px solid #222;
transition:.3s;
}

.social:hover{
transform:translateY(-3px) scale(1.05);
}

/* MAIN */
.main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

/* PAGES */
.page{
position:absolute;
opacity:0;
transform:scale(1.08) translateY(20px);
filter:blur(8px);
pointer-events:none;
transition:0.4s ease;
display:flex;
flex-direction:column;
align-items:center;
}

.page.active{
opacity:1;
transform:scale(1) translateY(0);
filter:blur(0);
pointer-events:auto;
}

/* INPUTS */
.input-box{
width:500px;
padding:15px;
border-radius:12px;
border:1px solid #7c3aed;
background:#000;
color:white;
margin-top:10px;
outline:none;
}

.btn{
margin-top:15px;
padding:12px 25px;
background:#7c3aed;
border:none;
border-radius:12px;
color:white;
cursor:pointer;
}

/* UPLOAD */
.file-label{
display:inline-block;
margin-top:10px;
padding:12px 20px;
border:1px solid #7c3aed;
border-radius:12px;
cursor:pointer;
}

.file-name{
margin-top:10px;
font-size:14px;
color:#aaa;
}

</style>
</head>

<body>

<div class="sidebar" id="sidebar">

<div class="header">
<div class="logo">nawy ai</div>
<div class="toggle-btn" onclick="toggleSidebar()">
<i class="fa-solid fa-bars"></i>
</div>
</div>

<div class="menu">

<a onclick="showPage('home')">
<i class="fa-solid fa-house"></i><span>Ana Sayfa</span>
</a>

<a onclick="showPage('youtube')">
<i class="fa-brands fa-youtube"></i><span>YouTube</span>
</a>

<a onclick="showPage('podcast')">
<i class="fa-solid fa-microphone"></i><span>Podcast</span>
</a>

<a onclick="showPage('settings')">
<i class="fa-solid fa-gear"></i><span>Ayarlar</span>
</a>

</div>

<div class="socials">
<a class="social discord"><i class="fa-brands fa-discord"></i></a>
<a class="social instagram"><i class="fa-brands fa-instagram"></i></a>
<a class="social tiktok"><i class="fa-brands fa-tiktok"></i></a>
</div>

</div>

<div class="main">

<!-- HOME -->
<div id="home" class="page active">
<h1>Welcome</h1>
</div>

<!-- YOUTUBE -->
<div id="youtube" class="page">
<h1>YouTube URL</h1>

<input class="input-box" placeholder="YouTube linkini yapıştır...">
<button class="btn">Özet Çıkar</button>
</div>

<!-- PODCAST -->
<div id="podcast" class="page">
<h1>Podcast Upload</h1>

<label class="file-label">
Dosya Seç
<input type="file" hidden onchange="showFile(this)">
</label>

<div class="file-name" id="fileName">Dosya seçilmedi</div>
</div>

<!-- SETTINGS -->
<div id="settings" class="page">
<h1>Ayarlar</h1>
</div>

</div>

<script>

function toggleSidebar(){
document.getElementById("sidebar").classList.toggle("collapsed");
}

function showPage(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

function showFile(input){
const fileName = input.files[0]?.name;
document.getElementById("fileName").innerText =
fileName ? fileName : "Dosya seçilmedi";
}

</script>

</body>
</html>
