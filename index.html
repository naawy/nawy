<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nawy.ai</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
height:100vh;
display:flex;
overflow:hidden;
}

/* SIDEBAR */
.sidebar{
width:260px;
background:#090909;
border-right:1px solid #151515;
padding:20px;
position:relative;
transition:0.35s ease;
overflow:hidden;
}

/* COLLAPSED (SADECE DARALMA) */
.sidebar.collapsed{
width:140px;
}

/* HEADER */
.header{
display:flex;
align-items:center;
justify-content:flex-start;
gap:10px;
margin-bottom:40px;
position:relative;
}

/* LOGO */
.logo{
font-size:20px;
font-weight:bold;
color:#e5e5e5;
transition:0.3s ease;
white-space:nowrap;
}

/* LOGO GİZLENİR */
.sidebar.collapsed .logo{
opacity:0;
transform:translateX(-20px);
width:0;
}

/* TOGGLE BUTTON */
.toggle-btn{
cursor:pointer;
font-size:18px;
padding:8px 10px;
border-radius:8px;
border:1px solid #2a2a2a;
background:#0f0f0f;
transition:0.3s ease;
}

/* COLLAPSED → EN ÜSTE SABİTLENİR */
.sidebar.collapsed .toggle-btn{
position:absolute;
top:10px;
left:10px;
}

/* MENU */
.menu a{
display:flex;
align-items:center;
gap:12px;
padding:14px;
margin-bottom:10px;
border-radius:14px;
color:white;
text-decoration:none;
cursor:pointer;
transition:.25s;
}

/* ICON BOX (SABİT BOYUT) */
.menu a i{
width:38px;
height:38px;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
background:linear-gradient(135deg,#1a1a1a,#0f0f0f);
border:1px solid #2a2a2a;
color:#f5f5f5;
transition:.3s;
}

/* TEXT */
.menu a span{
white-space:nowrap;
transition:0.2s ease;
}

/* TEXT HIDE */
.sidebar.collapsed .menu a span{
opacity:0;
transform:translateX(-20px);
width:0;
display:none;
}

/* CENTER ICONS WHEN COLLAPSED */
.sidebar.collapsed .menu a{
justify-content:center;
}

/* SOCIALS */
.socials{
position:absolute;
bottom:20px;
left:20px;
display:flex;
gap:10px;
}

.sidebar.collapsed .socials{
display:none;
}

/* SOCIAL */
.social{
width:40px;
height:40px;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
border:1px solid #222;
color:#f5f5f5;
}

/* MAIN */
.main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

/* PAGE */
.page{
position:absolute;
opacity:0;
transform:scale(1.08) translateY(20px);
filter:blur(8px);
pointer-events:none;
transition:0.4s ease;
display:flex;
flex-direction:column;
align-items:center;
}

.page.active{
opacity:1;
transform:scale(1) translateY(0);
filter:blur(0);
pointer-events:auto;
}

/* TITLE */
.title{
font-size:40px;
margin-bottom:20px;
color:white;
}

</style>
</head>

<body>

<div class="sidebar" id="sidebar">

<div class="header">

<div class="logo">nawy ai</div>

<div class="toggle-btn" onclick="toggleSidebar()">
<i class="fa-solid fa-bars"></i>
</div>

</div>

<div class="menu">

<a onclick="showPage('home')">
<i class="fa-solid fa-house"></i><span>Ana Sayfa</span>
</a>

<a onclick="showPage('youtube')">
<i class="fa-brands fa-youtube"></i><span>YouTube</span>
</a>

<a onclick="showPage('podcast')">
<i class="fa-solid fa-microphone"></i><span>Podcast</span>
</a>

<a onclick="showPage('settings')">
<i class="fa-solid fa-gear"></i><span>Ayarlar</span>
</a>

</div>

<div class="socials">
<a class="social"><i class="fa-brands fa-discord"></i></a>
<a class="social"><i class="fa-brands fa-instagram"></i></a>
<a class="social"><i class="fa-brands fa-tiktok"></i></a>
</div>

</div>

<div class="main">

<div id="home" class="page active">
<h1 class="title">Welcome to Nawy.ai</h1>
</div>

<div id="youtube" class="page"><h1 class="title">YouTube</h1></div>
<div id="podcast" class="page"><h1 class="title">Podcast</h1></div>
<div id="settings" class="page"><h1 class="title">Ayarlar</h1></div>

</div>

<script>

function toggleSidebar(){
document.getElementById("sidebar").classList.toggle("collapsed");
}

function showPage(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

</script>

</body>
</html>
