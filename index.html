<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nawy.ai</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
height:100vh;
display:flex;
overflow:hidden;
}

/* TOP */
.top-buttons{
position:absolute;
top:20px;
right:25px;
display:flex;
gap:15px;
z-index:10;
}

.top-buttons a{
padding:12px 20px;
border-radius:12px;
color:white;
text-decoration:none;
border:1px solid #5b21b6;
}

/* SIDEBAR */
.sidebar{
width:260px;
background:#090909;
border-right:1px solid #151515;
padding:20px;
position:relative;
transition:0.35s ease;
overflow:hidden;
}

.sidebar.collapsed{
width:110px;
}

/* HEADER (SABİT KALIR) */
.header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:40px;
position:relative;
}

/* LOGO ASLA SİLİNMEZ */
.logo{
font-size:20px;
font-weight:bold;
color:white;
transition:0.3s;
}

/* TOGGLE */
.toggle-btn{
cursor:pointer;
font-size:18px;
padding:8px 10px;
border-radius:8px;
border:1px solid #2a2a2a;
background:#0f0f0f;
}

/* COLLAPSED TOGGLE = SADECE YER DEĞİŞTİRİR */
.sidebar.collapsed .toggle-btn{
position:absolute;
top:0;
left:50%;
transform:translateX(-50%);
}

/* MENU */
.menu a{
display:flex;
align-items:center;
gap:12px;
padding:14px;
margin-bottom:10px;
border-radius:14px;
color:white;
text-decoration:none;
cursor:pointer;
transition:0.25s;
position:relative;
}

.menu a i{
width:38px;
height:38px;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
background:#111;
border:1px solid #2a2a2a;
}

/* TEXT */
.menu a span{
white-space:nowrap;
}

.sidebar.collapsed .menu a span{
display:none;
}

.sidebar.collapsed .menu a{
justify-content:center;
}

.sidebar.collapsed .menu a i{
background:transparent;
border:none;
font-size:20px;
}

/* NEON HOVER */
.menu a:hover i{
color:#a855f7;
box-shadow:0 0 10px rgba(124,58,237,0.8);
}

/* SOCIALS */
.socials{
position:absolute;
bottom:20px;
left:20px;
display:flex;
gap:10px;
}

.sidebar.collapsed .socials{
display:none;
}

.social{
width:40px;
height:40px;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
border:1px solid #222;
}

/* MAIN */
.main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

/* PAGE */
.page{
position:absolute;
opacity:0;
transform:scale(1.08) translateY(20px);
filter:blur(8px);
pointer-events:none;
transition:0.4s ease;
display:flex;
flex-direction:column;
align-items:center;
}

.page.active{
opacity:1;
transform:scale(1) translateY(0);
filter:blur(0);
pointer-events:auto;
}

/* TITLE */
h1{
font-size:40px;
}

</style>
</head>

<body>

<!-- TOP -->
<div class="top-buttons">
<a href="#">Oturum Aç</a>
<a href="#">Kayıt Ol</a>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

<div class="header">

<div class="logo">nawy ai</div>

<div class="toggle-btn" onclick="toggleSidebar()">
<i class="fa-solid fa-bars"></i>
</div>

</div>

<div class="menu">

<a onclick="showPage('home')">
<i class="fa-solid fa-house"></i><span>Ana Sayfa</span>
</a>

<a onclick="showPage('youtube')">
<i class="fa-brands fa-youtube"></i><span>YouTube</span>
</a>

<a onclick="showPage('podcast')">
<i class="fa-solid fa-microphone"></i><span>Podcast</span>
</a>

<a onclick="showPage('settings')">
<i class="fa-solid fa-gear"></i><span>Ayarlar</span>
</a>

</div>

<div class="socials">
<a class="social"><i class="fa-brands fa-discord"></i></a>
<a class="social"><i class="fa-brands fa-instagram"></i></a>
<a class="social"><i class="fa-brands fa-tiktok"></i></a>
</div>

</div>

<!-- MAIN -->
<div class="main">

<div id="home" class="page active">
<h1>Welcome</h1>
</div>

<div id="youtube" class="page">
<h1>YouTube</h1>
</div>

<div id="podcast" class="page">
<h1>Podcast</h1>
</div>

<div id="settings" class="page">
<h1>Ayarlar</h1>
</div>

</div>

<script>

function toggleSidebar(){
document.getElementById("sidebar").classList.toggle("collapsed");
}

function showPage(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

</script>

</body>
</html>
