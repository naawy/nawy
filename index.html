<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nawy.ai</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
height:100vh;
display:flex;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
width:260px;
background:#090909;
border-right:1px solid #151515;
padding:20px;
position:relative;
}

.logo{
font-size:24px;
font-weight:bold;
margin-bottom:40px;
color:#e5e5e5;
}

/* MENU */

.menu a{
display:flex;
align-items:center;
gap:12px;
padding:14px;
margin-bottom:10px;
border-radius:14px;
color:white;
text-decoration:none;
cursor:pointer;
transition:.3s;
}

.menu a i{
width:38px;
height:38px;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
background:linear-gradient(135deg,#1a1a1a,#0f0f0f);
border:1px solid #2a2a2a;
color:#f5f5f5;
transition:.3s;
}

.menu a:hover i{
transform:scale(1.08);
border-color:#ffffff33;
}

/* MAIN */

.main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

.page{
position:absolute;
opacity:0;
transform:scale(1.08) translateY(20px);
filter:blur(8px);
pointer-events:none;
transition:0.45s cubic-bezier(0.2, 0.9, 0.2, 1);
display:flex;
flex-direction:column;
align-items:center;
}

.page.active{
opacity:1;
transform:scale(1) translateY(0);
filter:blur(0);
pointer-events:auto;
}

.title{
font-size:40px;
margin-bottom:20px;
color:#f5f5f5;
}

/* SOCIALS */

.socials{
position:absolute;
bottom:20px;
left:20px;
display:flex;
gap:12px;
}

/* BASE SOCIAL BUTTON */
.social{
width:42px;
height:42px;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
text-decoration:none;
transition:.3s;
transform:translateY(0);
}

/* HOVER ANIMATION */
.social:hover{
transform:translateY(-5px) scale(1.1);
}

/* DISCORD */
.social.discord{
background:#5865F2;
color:white;
box-shadow:0 0 0 rgba(88,101,242,0);
}

.social.discord:hover{
box-shadow:0 0 12px rgba(88,101,242,0.6);
}

/* INSTAGRAM */
.social.instagram{
background:radial-gradient(circle at 30% 107%, 
#fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
color:white;
}

.social.instagram:hover{
box-shadow:0 0 12px rgba(214,36,159,0.5);
}

/* TIKTOK */
.social.tiktok{
background:#111;
color:white;
position:relative;
}

.social.tiktok::before{
content:"";
position:absolute;
inset:0;
border-radius:12px;
background:linear-gradient(45deg,#25F4EE,#FE2C55);
opacity:0.4;
}

.social.tiktok:hover{
box-shadow:0 0 12px rgba(254,44,85,0.4);
}

/* TOP BUTTONS */

.top-buttons{
position:absolute;
top:20px;
right:25px;
display:flex;
gap:15px;
z-index:999;
}

.neon-btn{
padding:12px 24px;
border-radius:12px;
color:white;
text-decoration:none;
border:1px solid #5b21b6;
opacity:0.8;
}

.upload-box{
width:500px;
height:220px;
border:2px dashed #5b21b6;
border-radius:16px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:15px;
background:#050505;
text-align:center;
padding:20px;
}

.file-name{
font-size:14px;
color:#a855f7;
}

input[type="file"]{
display:none;
}

.file-label{
padding:12px 20px;
border:1px solid #5b21b6;
border-radius:10px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="top-buttons">
<a href="#" class="neon-btn">Oturum Aç</a>
<a href="#" class="neon-btn">Kayıt Ol</a>
</div>

<div class="sidebar">

<div class="logo">NAWY.AI</div>

<div class="menu">

<a onclick="showPage('home')">
<i class="fa-solid fa-house"></i><span>Ana Sayfa</span>
</a>

<a onclick="showPage('youtube')">
<i class="fa-brands fa-youtube"></i><span>YouTube</span>
</a>

<a onclick="showPage('podcast')">
<i class="fa-solid fa-microphone"></i><span>Podcast</span>
</a>

<a onclick="showPage('settings')">
<i class="fa-solid fa-gear"></i><span>Ayarlar</span>
</a>

</div>

<div class="socials">

<a href="https://discord.com" target="_blank" class="social discord">
<i class="fa-brands fa-discord"></i>
</a>

<a href="https://instagram.com" target="_blank" class="social instagram">
<i class="fa-brands fa-instagram"></i>
</a>

<a href="https://tiktok.com" target="_blank" class="social tiktok">
<i class="fa-brands fa-tiktok"></i>
</a>

</div>

</div>

<div class="main">

<div id="home" class="page active">
<h1 class="title">Welcome to Nawy.ai</h1>
</div>

<div id="youtube" class="page">
<h1 class="title">YouTube URL</h1>
<input class="input-box" type="text" placeholder="YouTube linkini yapıştır...">
<button class="btn">Özet Çıkar</button>
</div>

<div id="podcast" class="page">

<h1 class="title">Podcast</h1>

<div class="upload-box">
<span>Dosyanı yükle</span>
<label class="file-label" for="fileUpload">Dosya Seç</label>
<input id="fileUpload" type="file">
<div id="fileName" class="file-name">Henüz dosya seçilmedi</div>
</div>

<button class="btn">Yükle</button>

</div>

<div id="settings" class="page">
<h1 class="title">Ayarlar</h1>
</div>

</div>

<script>

function showPage(pageId){
document.querySelectorAll('.page').forEach(p=>{
p.classList.remove('active');
});
document.getElementById(pageId).classList.add('active');
}

document.getElementById("fileUpload").addEventListener("change", function(){
const file = this.files[0];
document.getElementById("fileName").textContent =
file ? file.name : "Henüz dosya seçilmedi";
});

</script>

</body>
</html>
